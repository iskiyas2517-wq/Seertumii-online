services:
  - type: web
    name: seertumii-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seertumii-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: seertumii-db
